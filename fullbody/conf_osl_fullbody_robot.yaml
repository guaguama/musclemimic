# Position-controlled robot variant of the MyoAssist OSL full-body model (v3).
# Inherits the complete trajectory, goal, reward, termination, Warp, validation and
# PPO schedule from conf_osl_fullbody and overrides only what differs for the 29
# stateless robot actuators.
#
# Socket toggle: inherited whole from conf_osl_fullbody -- compliant_socket picks
# between osl_fullbody_robot.xml (nq 80) and
# osl_fullbody_robot_compliant_socket.xml (nq 84), and disable_eulerdamp still
# tracks `not compliant_socket` unless set explicitly.  Toggle on the CLI with
#   experiment.env_params.compliant_socket=true
# NOTE the toggle changes nq/nv and therefore the observation size -- checkpoints do
# not transfer across it.
#
# Both variants are driven by ONE servo table, derived once on the rigid model.  That
# is safe rather than exact: the compliant socket lowers right-hip effective inertia
# by up to 50%, so those three coordinates run at zeta 1.08-1.43 instead of 1.
# Measured worst Kd*dt/I is 0.600 on both variants against an Euler bound of 2.0.
#
# disable_fingers is inherited as true and stays a harmless no-op: the robot models
# already have the finger joints removed, and the env's deletion matches by name.
#
# Usage:
#   uv run fullbody/experiment.py --config-name=conf_osl_fullbody_robot
defaults:
  - conf_osl_fullbody
  - _self_

wandb:
  tags: ["fullbody", "osl_fullbody_robot", "position_control", "forward_walking"]

experiment:
  env_params:
    env_name: MjxOSLFullBodyRobot
    enable_muscle_length_observations: false
    enable_muscle_velocity_observations: false
    enable_muscle_force_observations: false
    enable_muscle_excitation_observations: false
    enable_muscle_activation_observations: false

  # actor_bias_init is opt-in -- the code default is "none", so it applies only
  # where set explicitly, as it is here. Fresh actors then start commanding the
  # model's qpos0 instead of the joint-range midpoint that zero action encodes;
  # capped at +/-0.95, so Gaussian samples can still clip. Restored checkpoint
  # parameters override initialization. Disable with:
  # experiment.ppo_config.actor_bias_init=none
  ppo_config:
    init_std: 0.2
    init_std_motors: 0.2
    actor_bias_init: qpos0  # enabled; change to none to disable
